name = "hlawka-schatten"
version = "0.1.0"
fixedToolchain = true
keywords = ["math"]
defaultTargets = [
  "HlawkaSchatten", "ExistenceChallenge", "ExistenceSolution",
  "ConstructionDiagonalChallenge", "ConstructionDiagonalSolution",
  "ConstructionDiagonalBelowExponentChallenge", "ConstructionDiagonalBelowExponentSolution"
]

[leanOptions]
weak.linter.mathlibStandardSet = true
autoImplicit = false
relaxedAutoImplicit = false
linter.unusedVariables = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "31ce06eaadf4a200c0e1407c5f10953cf606b8f8"

[[lean_lib]]
name = "HlawkaSchatten"

[[lean_lib]]
name = "ExistenceChallenge"

[[lean_lib]]
name = "ExistenceSolution"

[[lean_lib]]
name = "ConstructionDiagonalChallenge"

[[lean_lib]]
name = "ConstructionDiagonalSolution"

[[lean_lib]]
name = "ConstructionDiagonalBelowExponentChallenge"

[[lean_lib]]
name = "ConstructionDiagonalBelowExponentSolution"
