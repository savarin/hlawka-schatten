# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Dimension-independent Hlawka constants for Schatten norms"
  description: >-
    For every Schatten p-norm with 1 < p < infinity, a finite Hlawka
    constant exists that does not depend on dimension, and at both
    endpoints (trace norm, p = 1; operator norm, p = infinity) no constant
    exists. For complex diagonal matrices and every real p >= 256, the
    sharp constant is an explicit maximum over a one-parameter cyclic
    family: it holds in every dimension and cannot be lowered in any
    dimension at least three. A third result proves the ordinary Hlawka
    inequality for all triples in every finite real coordinate space with
    its p-norm, for every real p from 2 through log(3)/log(3/2), inclusive.
  authors:
    - "Ezzeri Esa"
  responsible_maintainers:
    - "Ezzeri Esa"
  license: "Apache-2.0"

classification:
  arxiv: ["math.FA", "math.OA"]
  msc2020: ["47A30", "47B10", "46B20"]

sources:
  - title: "Hlawka constants for Schatten norms and real coordinate spaces"
    authors:
      - "Ezzeri Esa"
    type: "original-proof"
    id: "https://github.com/savarin/hlawka-schatten"
    location: "Lean proof in this repository"
    relationship: "other"
    author_endorsement: "participated"
    note: >-
      The formalization proves three results. (1) A finite
      dimension-independent Hlawka constant exists for every interior
      Schatten exponent. GPT 5.6 Sol constructed the Lean proof.
      (2) For complex diagonal Schatten norms of size at least three
      and p >= 256 the sharp constant is an explicit cyclic maximum.
      GPT 6 Astra constructed the Lean proof. (3) Constant one works in real coordinate
      spaces of every finite dimension for 2 <= p <= log(3)/log(3/2).
      Agents using Codex and Claude Code developed and checked the proof.
      A search of arXiv:2407.03278, arXiv:1201.5232 and its forward
      citations through September 2026 found no prior proof of the first
      two results. The November 21, 2026 search found no resolution of
      Lee's Conjecture 4.9. The proofs have not been examined in depth
      by human experts. Novelty of the ideas has not been established.
  - title: "Problems and conjectures in matrix and operator inequalities"
    authors:
      - "Koenraad M. R. Audenaert"
      - "Fuad Kittaneh"
    type: "paper"
    id: "arXiv:1201.5232"
    location: "Section 8.2, Problem 7"
    relationship: "other"
    author_endorsement: "not-contacted"
    note: >-
      The source poses the existence of a finite dimension-independent Hlawka
      constant for Schatten p-norms as an open problem (Section 8.2, Problem 7).
      This formalization supplies a proof for 1 < p < infinity and proves that
      no such constant exists at p = 1 or p = infinity. We are not aware of a
      prior published proof.
  - title: "Sharp uniform convexity and smoothness inequalities for trace norms"
    authors:
      - "Keith Ball"
      - "Eric A. Carlen"
      - "Elliott H. Lieb"
    type: "paper"
    id: "doi:10.1007/BF01231769"
    location: "Theorems 1 and 2"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The Ball-Carlen-Lieb framework for uniform convexity and smoothness of
      Schatten norms motivated the proof approach. The formalization derives
      the scalar Bregman-to-Mazur comparison bounds directly from the
      convexity of the power potential rather than invoking their theorems.
  - title: "Sur certaines inégalités qui caractérisent les fonctions convexes"
    authors:
      - "Tiberiu Popoviciu"
    type: "paper"
    id: "Zbl:0166.06303"
    location: "Main theorem"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Popoviciu's inequality for convex functions on three points. The
      diagonal proof's weighted scalar convexity step proves the same
      inequality by an independent ordered-chord argument.

  - title: "Sharp diagonal Hlawka constants: lower the cutoff to 2"
    type: "other"
    id: "https://prove2.me/missions/Sharp_diagonal_Hlawka_constants%3A_lower_the_cutoff_to_2"
    location: "Leaf (A), theorem 9e0c08c7-583b-41b0-b8a3-57fa9532b2c1"
    relationship: "other"
    note: >-
      The mission supplies the exact real-coordinate statement. The five
      norm and deficit definitions follow the HlawkaSchatten source library
      at commit 79aa498bfcf7b22bd91d771fb32ec278e2d4704b.
  - title: "The sharp diagonal Hlawka constant for every real exponent p >= 4"
    type: "other"
    id: "https://prove2.me/theorems/0ee0074e-f0be-4d07-89a9-f8012acf0199"
    location: "HlawkaSchatten.DiagonalCutoff4.cutoff4, Prove2Me cutoff-4 mission"
    relationship: "background"
    note: >-
      The external Lean theorem gives the sharp constant for complex
      coordinates in every finite dimension for p >= 4. It covers the
      upper endpoint of the real three-dimensional question. Its proof
      is maintained outside this repository.
  - title: "Constructions and reductions on the Hornich–Hlawka inequality and its generalizations"
    authors: ["Seokbin Lee"]
    type: "paper"
    id: "arXiv:2610.23785v1"
    location: "Proposition 3.8, Theorem 4.6, Conjecture 4.9, and Theorem 4.10"
    relationship: "background"
    note: >-
      Proposition 3.8 gives the obstruction above the threshold. Theorem
      4.6 gives the stable-law transfer in dimension three. Conjecture 4.9
      asks about the endpoint in that dimension. Theorem 4.10 supplies
      the dual four-ball criterion. The Lean proof treats every finite dimension.
  - title: "Diagonal Minkowski classes, zonoid equivalence, and stable laws"
    authors: ["Ilya Molchanov", "Felix Nagel"]
    type: "paper"
    id: "arXiv:1806.08036"
    location: "Lemma 4.9 and Theorem 4.12"
    relationship: "background"
    note: >-
      Stable random variables yield a nesting theorem for classes of
      convex bodies defined by diagonal images of norm balls. This is
      background for the averaging step in the exponent transfer.
  - title: "A survey of the Hornich-Hlawka inequality"
    authors: ["Dan-Ştefan Marinescu", "Constantin P. Niculescu"]
    type: "paper"
    id: "arXiv:2407.03278"
    location: "Problem 1"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Asks for a proof that real l_p in dimension three fails Hlawka's
      inequality for every p > 2, including p = infinity. The third result answers the question
      in the negative for 2 < p <= log(3)/log(3/2).
  - title: "Metric inequalities and the zonoid problem"
    authors: ["H. S. Witsenhausen"]
    type: "paper"
    id: "doi:10.1090/S0002-9939-1973-0390916-0"
    location: "Corollary 1.2, p. 518, and the proof of Proposition 2, p. 519"
    relationship: "background"
    note: >-
      The signed triple credited to D. M. and M. F. Smiley fails
      Hlawka's inequality in real l_p in dimension three for
      p > log(3)/log(3/2). The paper also gives the classical range
      1 <= p <= 2.
  - title: "On Certain Intersection Properties of Convex Sets"
    authors: ["V. L. Klee, Jr."]
    type: "paper"
    id: "doi:10.4153/CJM-1951-031-2"
    location: "Canadian Journal of Mathematics 3 (1951), 272, (2.1)"
    relationship: "background"
    note: >-
      The compact convex intersection lemma is formalized as
      klee_intersection in HlawkaSchatten/BelowExponent/Intersection.lean.
  - title: "A simplex reduction and certificates for the critical Hlawka exponent"
    type: "other"
    location: "HlawkaSchatten/BelowExponent/RouteT.lean, HlawkaSchatten/BelowExponent/RegionalCertificates.lean and BLUEPRINT.md"
    relationship: "other"
    note: >-
      The covering reduction and the bulk certificate were produced with Claude
      Fable 5.2 (Anthropic) in a Claude Code session, 21 November 2026. The code mapping
      in BLUEPRINT.md connects these contributions to their Lean modules.
      The team checked the inputs, completed the facet and boundary regions,
      and formalized the proof. Lean verifies the certificates.

status:
  scope: >-
    The first two results concern finite-dimensional complex operators and
    diagonal matrices. Existence:
    for every real p > 1 a finite constant works for linear maps between
    all finite-dimensional complex inner product spaces, and no constant
    exists at p = 1 (complex 2 by 2 operators) or p = infinity (complex
    3 by 3 matrices). Construction: for complex diagonal matrices and every
    real p >= 256, an explicit cyclic maximum is a Hlawka constant in every
    finite dimension and the smallest one in each dimension at least three.
    The sharp constant for general operators remains open. The third
    theorem treats real coordinate spaces in all natural dimensions on
    the closed interval 2 <= p <= log(3)/log(3/2). The mission also asks
    whether K_p bounds every triple in real dimension three from that
    threshold through 4. The lower endpoint follows from the third result
    and K_p >= 1. The external Prove2Me theorem
    HlawkaSchatten.DiagonalCutoff4.cutoff4 covers p = 4, leaving
    log(3)/log(3/2) < p < 4 open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "PalomarHlawkaSchatten.dimension_independent_hlawka_constant_for_schatten_norms"
      file: "ExistenceSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-existence.json"
    - declaration: "PalomarHlawkaSchatten.ConstructionDiagonal.diagonal_hlawka_bound"
      file: "ConstructionDiagonalSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-construction-diagonal.json"
    - declaration: "PalomarHlawkaSchatten.ConstructionDiagonal.diagonal_hlawka_sharp"
      file: "ConstructionDiagonalSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-construction-diagonal.json"
    - declaration: "PalomarHlawkaSchatten.ConstructionDiagonal.cyclic_maximum_attained"
      file: "ConstructionDiagonalSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-construction-diagonal.json"
    - declaration: "HlawkaSchatten.LpThreshold.hlawka_holds_below_exponent"
      file: "ConstructionDiagonalBelowExponentSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-construction-diagonal-below-exponent.json"

automation:
  methods:
    - method: "agent"
      models: ["GPT 5.6 Sol (OpenAI)"]
      framework: "Codex"
      tool_setup: >-
        Agentic proof construction with Lean elaboration, full Lake builds,
        exact-arithmetic endpoint reductions, and independent proof-source audit.
      prompting_notes: >-
        The agent was given the audited mathematical proof artifacts and nearby
        operator-theory formalizations as references.
    - method: "agent"
      models: ["GPT 6 Astra (OpenAI)"]
      framework: "Codex"
      tool_setup: >-
        Diagonal construction in kernel-checked Lean layers, full Lake builds,
        publication-boundary axiom audits, and Comparator statement checks.
      prompting_notes: >-
        The agent was given the scalar/diagonal tail proof and its dependency,
        cutoff, and failure-analysis notes, and asked to follow the existing
        repository's Challenge/Solution and Comparator conventions.
    - method: "agent"
      models: ["GPT 6.2 Astra (OpenAI)", "GPT 6.2 Sol (OpenAI)", "Claude Opus 5.5 (Anthropic)", "Claude Fable 5.2 (Anthropic)"]
      framework: "Codex and Claude Code"
      tool_setup: >-
        The agents developed and cross-checked a written proof, generated
        exact certificates, proved their soundness in Lean and checked the
        public theorem's type and axioms. The author directed the work.
  notes: >-
    Existence: the Lean proof was developed in small kernel-checked layers
    and audited at the publication boundary for dimensional uniformity and
    endpoint fidelity. Construction: the argument was developed over two
    weeks of directed proof search. The human author identified the proof
    strategy, diagnosed repeated dead ends where agents stalled, and
    refined the approach through failure analysis at each stage. AI agents
    executed computational searches, produced candidate lemmas, and
    formalized the final argument in Lean. Below the critical exponent:
    the author directed the research and verification. The agents developed
    and reviewed the regional arguments and their assembly, generated exact
    certificates, and checked the public boundary.

fidelity:
  divergences: >-
    The interior theorem is stated for linear maps between arbitrary finite
    complex Hilbert spaces, a coordinate-free formulation equivalent to
    fixing coordinate matrix spaces via choice of orthonormal bases. The proof library constructs explicit constants m_p, M_p from the
    compactified scalar Bregman-to-Mazur ratio, but the Challenge boundary
    quantifies existentially over m and M without naming the construction.
    Infinity is represented by Mathlib's spectral L2 operator norm, since
    infinity is not a real exponent in schattenPNorm.
    The diagonal boundary specifies the cyclic constant by a compact
    supremum on [1/2, 2] and proves attainment, admissibility, and
    sharpness. It defines the norm through actual singular values. The
    Lean proof departs from the written proof it formalizes (not included
    in this repository) only in intermediate choices: an ordered-chord
    proof of the weighted three-point convexity inequality, a direct
    sparse-minimizer argument, the rational separator 939/2000, the radial
    residual constant 300, and looser Hessian coefficients. The exponent
    cutoff 256 is unchanged; it is set by the localization estimate, not
    by the curvature margin.
    The below-exponent result uses the finite power-sum norm on real
    coordinates from the published mission. The Lean proof uses adaptive
    subdivisions in several regions and verifies their coverage and bounds
    in the kernel. The independent Challenge gives all five definitions
    inline and imports only Mathlib. The complete written proof of the
    third result is separate from this repository.

