    - source: "Cutoff-to-two mission, leaf (A)"
      lean: "HlawkaSchatten.LpThreshold.hlawka_holds_below_exponent"
      module: "ConstructionDiagonalBelowExponentSolution"
      status: "proved"
      note: >-
        The real exponent interval is closed at both ends. The quantifiers
        include every natural dimension and every triple of real vectors.
        The declaration keeps the mission's namespace,
        HlawkaSchatten.LpThreshold, and adds _exponent to its name.

