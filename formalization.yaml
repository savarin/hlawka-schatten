        exact-arithmetic endpoint reductions, and independent proof-source audit.
      cost:
        wall_time: "approximately 6 hours across resumed sessions"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        The agent was given the audited mathematical proof artifacts and nearby
        operator-theory formalizations as references.
    - method: "agent"
      models: ["GPT 6 Astra (OpenAI)"]
      framework: "Codex"
      tool_setup: >-
        Diagonal construction in kernel-checked Lean layers, full Lake builds,
        publication-boundary axiom audits, and Comparator statement checks.
      prompting_notes: >-
        The agent was given the scalar/diagonal tail proof and its dependency,
        cutoff, and failure-analysis notes, and asked to follow the existing
        repository's Challenge/Solution and Comparator conventions.
  spend_usd: "subscription-based"
  notes: >-
    The proof was developed in small kernel-checked layers and audited at the
    publication boundary for dimensional uniformity and endpoint fidelity.

fidelity:
  divergences: >-
    The interior theorem is stated for linear maps between arbitrary finite
    complex Hilbert spaces, which is stronger than fixing coordinate matrix
    spaces. The proof library constructs explicit constants m_p, M_p from the
    compactified scalar Bregman-to-Mazur ratio, but the Challenge boundary
    quantifies existentially over m and M without naming the construction.
    Infinity is represented by Mathlib's spectral L2 operator norm, since
    infinity is not a real exponent in schattenPNorm.
    The diagonal boundary specifies the cyclic constant by a compact
    supremum on [1/2, 2] and proves attainment, admissibility, and sharpness.
    It defines the norm through actual singular values. Intermediate
    changes from the written tail proof include an ordered-chord convexity
    argument, a direct sparse minimization proof, the rational separator
    939/2000, a radial residual constant of 300 instead of 110, looser
    Hessian coefficients, and a closed-convex-hull circle transfer.
    These changes retain the stated real exponent cutoff of 256.

review:
  status: "agent-reviewed"
  reviewers:
    - "Ezzeri Esa"
    - "GPT 5.6 Sol (OpenAI)"
    - "GPT 6 Astra (OpenAI)"
  notes: >-
    The existence proof source was independently audited before formalization.
    Its final Challenge was checked against the input statement, and the proof
    sources were scanned for unresolved holes and user axioms. The diagonal
    extension was reviewed by its implementing Codex agent against the written
    tail proof, with kernel checks and boundary axiom audits. This does not
    claim a separate independent review of the new Lean proof or an in-depth
    human expert review.

