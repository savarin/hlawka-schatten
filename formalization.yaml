  notes: >-
    The existence proof source was independently audited before formalization.
    The diagonal proof was reviewed against the BLUEPRINT.
    Both Challenges were checked against their proof sources.
    The earlier results were locally validated with the full Lake build, both boundary/axiom audits,
    both Comparator baselines (upstream 8d84e67, macOS development
    Landrun shim, default Lean kernel), and both negative controls.
    Protected Landrun/NanoDa validation deferred to Palomar submission.
    For the third result the agents reviewed the written regional proofs,
    the joins and the published statement. On November 26, 2026, a clean
    local build with Lean 4.37.0-rc1, the boundary and axiom audit and the
    byte-for-byte regeneration of the certificates passed. The stock Lean
    and NanoDa checks of this version and a run within the verification
    budget are still to be recorded.
    The two historical registry entries concern their respective commits.

