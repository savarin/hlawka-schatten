  namespace: "PalomarHlawkaSchatten"
  statements:
    - source: "Audenaert--Kittaneh, Section 8.2, Problem 7"
      lean: "PalomarHlawkaSchatten.dimension_independent_hlawka_constant_for_schatten_norms"
      module: "ExistenceSolution"
      status: "proved"
      note: >-
        Proves dimension-independent interior finiteness and
        fixed-dimensional obstructions at p=1 and p=infinity.
    - source: "proof/diagonal-construction.md, Statement and explicit constant"
      lean: "PalomarHlawkaSchatten.ConstructionDiagonal.diagonal_hlawka_bound"
      module: "ConstructionDiagonalSolution"
      status: "proved"
      note: >-
        The explicit cyclic maximum bounds all finite complex diagonal
        Schatten spaces for every real p >= 256, including unequal norms.
    - source: "proof/diagonal-construction.md, Statement and explicit constant"
      lean: "PalomarHlawkaSchatten.ConstructionDiagonal.diagonal_hlawka_sharp"
      module: "ConstructionDiagonalSolution"
      status: "proved"
      note: "Every admissible constant in each dimension at least three is at least the cyclic maximum."
    - source: "proof/diagonal-construction.md, Statement and explicit constant"
      lean: "PalomarHlawkaSchatten.ConstructionDiagonal.cyclic_maximum_attained"
      module: "ConstructionDiagonalSolution"
      status: "proved"
      note: "A cyclic parameter in [1/2, 2] attains the maximum."

