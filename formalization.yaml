# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Dimension-independent Hlawka constants for Schatten norms"
  description: >-
    Existence of a dimension-independent Hlawka constant for every Schatten
    p-norm with 1 < p < infinity, and proof that no such constant exists at
    either endpoint (trace norm at p=1, operator norm at p=infinity).
    For complex diagonal matrices and every real p >= 256, an explicit
    cyclic maximum is the sharp constant in every dimension at least three.
  authors:
    - "Ezzeri Esa"
  responsible_maintainers:
    - "Ezzeri Esa"
  license: "Apache-2.0"

classification:
  arxiv: ["math.FA", "math.OA"]
  msc2020: ["47A30", "47B10", "46B20"]

sources:
  - title: "Existence of finite Hlawka constants for interior Schatten exponents"
    authors:
      - "Ezzeri Esa"
    type: "original-proof"
    id: "https://github.com/savarin/hlawka-schatten"
    location: "Lean proof in this repository"
    relationship: "other"
    author_endorsement: "participated"
    note: >-
      This formalization first presents the proof recorded by the compared
      Lean theorem. The existence question was posed as an open problem by
      Audenaert and Kittaneh in 2012. The Lean proof was constructed with
      GPT 5.6 Sol. A literature search of the 2024 Hornich-Hlawka survey,
      source-paper citations, and recent Schatten-norm work through August
      2026 found no prior proof. The proof has not been examined in depth by
      human experts; novelty of its ideas has not been established.
  - title: "The sharp cyclic Hlawka constant for diagonal Schatten norms"
    authors:
      - "Ezzeri Esa"
    type: "original-proof"
    id: "https://github.com/savarin/hlawka-schatten"
    location: "proof/diagonal-construction.md and ConstructionDiagonalSolution.lean"
    relationship: "other"
    author_endorsement: "participated"
    note: >-
      Formalizes the scalar/diagonal tail argument developed on 2026-09-21/22.
      The bound holds for every real p >= 256 and every finite dimension,
      with sharpness in each dimension at least three and attainment by
      an explicit cyclic family. The Lean proof was constructed with Codex.
      This does not determine the sharp constant for arbitrary matrices.
  - title: "Problems and conjectures in matrix and operator inequalities"
    authors:
      - "Koenraad M. R. Audenaert"
      - "Fuad Kittaneh"
    type: "paper"
    id: "arXiv:1201.5232"
    location: "Section 8.2, Problem 7"
    relationship: "other"
    author_endorsement: "not-contacted"
    note: >-
      The source poses the existence of a finite dimension-independent Hlawka
      constant for Schatten p-norms as an open problem (Section 8.2, Problem 7).
      This formalization supplies a proof for 1 < p < infinity and proves that
      no such constant exists at p = 1 or p = infinity. We are not aware of a
      prior published proof.
  - title: "Sharp uniform convexity and smoothness inequalities for trace norms"
    authors:
      - "Keith Ball"
      - "Eric A. Carlen"
      - "Elliott H. Lieb"
    type: "paper"
    id: "doi:10.1007/BF01231769"
    location: "Theorems 1 and 2"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The Ball-Carlen-Lieb framework for uniform convexity and smoothness of
      Schatten norms motivated the proof approach. The formalization derives
      the scalar Bregman-to-Mazur comparison bounds directly from the
      convexity of the power potential rather than invoking their theorems.

status:
  scope: >-
    The formalization covers finite-dimensional rectangular complex operators.
    For every p > 1 it proves the existence of a finite dimension-independent
    Hlawka constant via scalar Bregman comparison. It also proves failure at
    p=1 on complex 2 by 2 operators and at p=infinity on complex 3 by 3
    matrices. A separate construction determines the sharp constant for
    complex diagonal Schatten norms for every real p >= 256, in every
    dimension at least three; its upper bound holds in all finite dimensions.
    Sharpness for arbitrary operators and the diagonal range below 256 are
    not determined by the construction.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "PalomarHlawkaSchatten.dimension_independent_hlawka_constant_for_schatten_norms"
      file: "ExistenceSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-existence.json"
    - declaration: "PalomarHlawkaSchatten.ConstructionDiagonal.diagonal_hlawka_bound"
      file: "ConstructionDiagonalSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-construction-diagonal.json"
    - declaration: "PalomarHlawkaSchatten.ConstructionDiagonal.diagonal_hlawka_sharp"
      file: "ConstructionDiagonalSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-construction-diagonal.json"
    - declaration: "PalomarHlawkaSchatten.ConstructionDiagonal.cyclic_maximum_attained"
      file: "ConstructionDiagonalSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-construction-diagonal.json"

