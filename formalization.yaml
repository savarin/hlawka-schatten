version: "v0.4"

project:
  name: "Dimension-independent Hlawka constants for Schatten norms"
  description: >-
    For every Schatten p-norm with 1 < p < infinity, a finite Hlawka
    constant exists that does not depend on dimension, and at both
    endpoints (trace norm, p = 1; operator norm, p = infinity) no constant
    exists. For complex diagonal matrices and every real p >= 256, the
    sharp constant is an explicit maximum over a one-parameter cyclic
    family: it holds in every dimension and cannot be lowered in any
    dimension at least three.
  authors:
    - "Ezzeri Esa"
  responsible_maintainers:
    - "Ezzeri Esa"
  license: "Apache-2.0"

classification:
  arxiv: ["math.FA", "math.OA"]
  msc2020: ["47A30", "47B10", "46B20"]

sources:
  - title: "Hlawka constants for Schatten norms: existence and sharp diagonal bound"
    authors:
      - "Ezzeri Esa"
    type: "original-proof"
    id: "https://github.com/savarin/hlawka-schatten"
    location: "Lean proof in this repository"
    relationship: "other"
    author_endorsement: "participated"
    note: >-
      This formalization proves two results. (1) A finite
      dimension-independent Hlawka constant exists for every interior
      Schatten exponent; Lean proof constructed with GPT 5.6 Sol.
      (2) The sharp constant for complex diagonal Schatten norms at
      every real p >= 256; Lean proof constructed with GPT 6 Astra.
      A search of arXiv:2407.03278, arXiv:1201.5232 and its forward
      citations through September 2026 found no prior proof of either
      result. The proofs have not been examined in depth by human
      experts; novelty of the ideas has not been established.
  - title: "Problems and conjectures in matrix and operator inequalities"
    authors:
      - "Koenraad M. R. Audenaert"
      - "Fuad Kittaneh"
    type: "paper"
    id: "arXiv:1201.5232"
    location: "Section 8.2, Problem 7"
    relationship: "other"
    author_endorsement: "not-contacted"
    note: >-
      The source poses the existence of a finite dimension-independent Hlawka
      constant for Schatten p-norms as an open problem (Section 8.2, Problem 7).
      This formalization supplies a proof for 1 < p < infinity and proves that
      no such constant exists at p = 1 or p = infinity. We are not aware of a
      prior published proof.
  - title: "Sharp uniform convexity and smoothness inequalities for trace norms"
    authors:
      - "Keith Ball"
      - "Eric A. Carlen"
      - "Elliott H. Lieb"
    type: "paper"
    id: "doi:10.1007/BF01231769"
    location: "Theorems 1 and 2"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The Ball-Carlen-Lieb framework for uniform convexity and smoothness of
      Schatten norms motivated the proof approach. The formalization derives
      the scalar Bregman-to-Mazur comparison bounds directly from the
      convexity of the power potential rather than invoking their theorems.
  - title: "Sur certaines inégalités qui caractérisent les fonctions convexes"
    authors:
      - "Tiberiu Popoviciu"
    type: "paper"
    id: "Zbl:0166.06303"
    location: "Main theorem"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Popoviciu's inequality for convex functions on three points. The
      diagonal proof's weighted scalar convexity step proves the same
      inequality by an independent ordered-chord argument.

status:
  scope: >-
    The formalization proves two results about Hlawka constants for
    Schatten p-norms of finite-dimensional complex operators. Existence:
    for every real p > 1 a finite constant works for linear maps between
    all finite-dimensional complex inner product spaces, and no constant
    exists at p = 1 (complex 2 by 2 operators) or p = infinity (complex
    3 by 3 matrices). Construction: for complex diagonal matrices and every
    real p >= 256, an explicit cyclic maximum is a Hlawka constant in every
    finite dimension and the smallest one in each dimension at least three.
    The sharp constant for general operators and the diagonal constant
    below p = 256 are not determined.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "PalomarHlawkaSchatten.dimension_independent_hlawka_constant_for_schatten_norms"
      file: "ExistenceSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-existence.json"
    - declaration: "PalomarHlawkaSchatten.ConstructionDiagonal.diagonal_hlawka_bound"
      file: "ConstructionDiagonalSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-construction-diagonal.json"
    - declaration: "PalomarHlawkaSchatten.ConstructionDiagonal.diagonal_hlawka_sharp"
      file: "ConstructionDiagonalSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-construction-diagonal.json"
    - declaration: "PalomarHlawkaSchatten.ConstructionDiagonal.cyclic_maximum_attained"
      file: "ConstructionDiagonalSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-construction-diagonal.json"

automation:
  methods:
    - method: "agent"
      models: ["GPT 5.6 Sol (OpenAI)"]
      framework: "Codex"
      tool_setup: >-
        Agentic proof construction with Lean elaboration, full Lake builds,
        exact-arithmetic endpoint reductions, and independent proof-source audit.
      prompting_notes: >-
        The agent was given the audited mathematical proof artifacts and nearby
        operator-theory formalizations as references.
    - method: "agent"
      models: ["GPT 6 Astra (OpenAI)"]
      framework: "Codex"
      tool_setup: >-
        Diagonal construction in kernel-checked Lean layers, full Lake builds,
        publication-boundary axiom audits, and Comparator statement checks.
      prompting_notes: >-
        The agent was given the scalar/diagonal tail proof and its dependency,
        cutoff, and failure-analysis notes, and asked to follow the existing
        repository's Challenge/Solution and Comparator conventions.
  notes: >-
    Existence: the Lean proof was developed in small kernel-checked layers
    and audited at the publication boundary for dimensional uniformity and
    endpoint fidelity. Construction: the argument was developed over two
    weeks of directed proof search. The human author identified the proof
    strategy, diagnosed repeated dead ends where agents stalled, and
    refined the approach through failure analysis at each stage. AI agents
    executed computational searches, produced candidate lemmas, and
    formalized the final argument in Lean.

fidelity:
  divergences: >-
    The interior theorem is stated for linear maps between arbitrary finite
    complex Hilbert spaces, a coordinate-free formulation equivalent to
    fixing coordinate matrix spaces via choice of orthonormal bases. The proof library constructs explicit constants m_p, M_p from the
    compactified scalar Bregman-to-Mazur ratio, but the Challenge boundary
    quantifies existentially over m and M without naming the construction.
    Infinity is represented by Mathlib's spectral L2 operator norm, since
    infinity is not a real exponent in schattenPNorm.
    The diagonal boundary specifies the cyclic constant by a compact
    supremum on [1/2, 2] and proves attainment, admissibility, and
    sharpness. It defines the norm through actual singular values. The
    Lean proof departs from the written proof it formalizes (not included
    in this repository) only in intermediate choices: an ordered-chord
    proof of the weighted three-point convexity inequality, a direct
    sparse-minimizer argument, the rational separator 939/2000, the radial
    residual constant 300, and looser Hessian coefficients. The exponent
    cutoff 256 is unchanged; it is set by the localization estimate, not
    by the curvature margin.

