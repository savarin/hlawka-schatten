name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
      - name: Check existence boundary
        run: python3 scripts/check_boundary.py comparator-existence.json
      - name: Check diagonal construction boundary
        run: python3 scripts/check_boundary.py comparator-construction-diagonal.json
