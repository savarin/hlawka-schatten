name: build

on:
  push:
  pull_request:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          build: true
      - name: Check publication boundary
        run: |
          lake env lean ExistenceChallenge.lean
          lake env lean ExistenceSolution.lean
